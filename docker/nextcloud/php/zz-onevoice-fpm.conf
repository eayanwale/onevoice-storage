; Loaded after the image's www.conf and zz-docker.conf, so these win.
; 12 children (native: 16) to fit the app container's 2 GiB limit at
; ~120 MiB per worker plus opcache. See docs/migration/plan.md.
[www]
pm = dynamic
pm.max_children = 12
pm.start_servers = 4
pm.min_spare_servers = 4
pm.max_spare_servers = 8
; Same 3600 s ceiling as max_execution_time and nginx's fastcgi_read_timeout,
; so a worker wedged on a slow B2 round trip is eventually reclaimed.
request_terminate_timeout = 3600
