; Mirrors /etc/php.d/99-nextcloud.ini from bluehost/provision.sh so the
; container behaves like the native install. See #78 for why uploads are 2G.
memory_limit = 512M
upload_max_filesize = 2G
post_max_size = 2G
max_execution_time = 3600
max_input_time = 3600
output_buffering = 0
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 1
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.memory_consumption = 128
opcache.save_comments = 1
opcache.revalidate_freq = 60
