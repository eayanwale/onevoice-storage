# Same as bluehost/files/rate-limit.conf. Keyed on the connecting address,
# which is the Docker bridge gateway (cloudflared -> 127.0.0.1:80 -> docker-proxy),
# so like the native install this is one shared bucket, not per-client.
# Per-client limiting via CF-Connecting-IP is a planned follow-up.
limit_req_zone $binary_remote_addr zone=nextcloud_limit:10m rate=10r/s;
