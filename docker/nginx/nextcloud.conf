# The production server block from bluehost/provision.sh, adapted for compose:
# the root is the image's /var/www/html (bind-mounted read-only into this
# container) and PHP is the `app` service on fastcgi port 9000 instead of a
# unix socket. Comments explaining each block live in provision.sh; only the
# differences are noted here.
upstream php-handler {
    server app:9000;
}

server {
    listen 80;
    server_name _;
    root /var/www/html;

    client_max_body_size 2G;
    fastcgi_buffers 64 4K;

    location = /.well-known/carddav  { return 301 /remote.php/dav/; }
    location = /.well-known/caldav   { return 301 /remote.php/dav/; }
    location = /.well-known/webfinger { return 301 /index.php/.well-known/webfinger; }
    location = /.well-known/nodeinfo  { return 301 /index.php/.well-known/nodeinfo; }

    location / {
        limit_req zone=nextcloud_limit burst=20 nodelay;
        rewrite ^ /index.php$request_uri;
    }

    location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)/ {
        deny all;
    }

    location ~ \.php(?:$|/) {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_pass php-handler;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 3600;
        fastcgi_send_timeout 3600;
        include fastcgi_params;
    }

    location ~ ^/(?:updater|ocs-provider)(?:$|/) {
        try_files $uri $uri/ =404;
        index index.php;
    }

    location ~ \.mjs$ {
        default_type text/javascript;
        expires 30d;
        access_log off;
    }

    location ~ \.map$ {
        default_type application/json;
        expires 30d;
        access_log off;
    }

    # Includes the #101 additions (jpeg/webp/fonts/wasm and the Viewer's
    # blank.mp4); see that issue.
    location ~ \.(?:css|js|svg|gif|png|jpg|jpeg|webp|ico|woff2?|ttf|otf|wasm|mp4|webm)$ {
        expires 30d;
        access_log off;
    }
}
