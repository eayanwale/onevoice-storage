# Since 2026-10-02 the data dir lives in the app container (#108). Run the
# same stale-chunk cleanup there, as the container's www-data, so no host user
# for uid 33 is needed. docker itself needs root.
[Service]
User=root
Group=root
ExecStart=
ExecStart=/bin/sh -c 'h=$${CHUNK_CLEANUP_STALE_HOURS:-3}; docker exec -u www-data onevoice-app-1 find /var/www/nextcloud/data -mindepth 3 -maxdepth 3 -type d -path "*/uploads/*" -mmin +$$((h*60)) -print -exec rm -rf {} +'
